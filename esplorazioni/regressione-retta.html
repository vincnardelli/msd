<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trova la retta</title>
<style>
  :root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--soft:#f8fafc;--p1:#2563eb;--p2:#113159;--p3:#7c3aed;--red:#b91c1c;--oro:#d4930d;--ok:#059669}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;padding:12px 14px;font-size:14px;line-height:1.45}
  [hidden]{display:none!important}
  b{font-weight:700}
  .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .modi{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px}
  .modi a{padding:8px 14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;color:var(--ink)}
  .modi a:hover{border-color:var(--line)}
  .modi a.on{border-color:var(--p2);color:var(--p2)}
  .fs{margin-left:auto;align-self:center;font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
  .row{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pills button,.btn{font:inherit;font-size:12.5px;font-weight:600;line-height:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
  .pills button.on{border-color:var(--p2);background:var(--p2);color:#fff}
  .btn:hover,.pills button:hover{border-color:var(--ink)}
  .btn.pri{background:var(--p2);border-color:var(--p2);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  label.ck{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;user-select:none}
  label.ck i{width:12px;height:3px;display:inline-block;border-radius:2px}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
  @media (max-width:820px){.main{grid-template-columns:1fr}}
  .chart{position:relative;touch-action:none}
  svg{width:100%;height:auto;display:block;overflow:visible}
  .tick{font-size:11px;fill:var(--muted)}
  .axt{font-size:12px;fill:var(--ink);font-weight:600}
  .handle{cursor:ns-resize}
  .handle circle.v{fill:#fff;stroke:var(--oro);stroke-width:3}
  .handle:hover circle.v{fill:#fef3c7}
  .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.1);display:none;white-space:nowrap;z-index:2}
  .tip .c{color:var(--muted)}
  .side{display:flex;flex-direction:column;gap:10px}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff}
  .card.soft{background:var(--soft)}
  .card.ok{background:#ecfdf5;border-color:#a7f3d0}
  .eq{font-size:15px;font-weight:700;color:var(--p2);margin-top:3px}
  .big{font-size:24px;font-weight:800;color:var(--p2);line-height:1.1}
  .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 2px;position:relative}
  .bar span{display:block;height:100%;background:var(--red);transition:width .25s}
  .bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--p2)}
  .mini{font-size:12px;color:var(--muted)}
  .pred input[type=range]{width:100%;margin-top:8px}
  .warn{color:var(--red);font-weight:600}
  .casi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px}
  @media (max-width:640px){.casi{grid-template-columns:1fr}}
  .caso{border:1px solid var(--line);border-left:5px solid var(--p1);border-radius:10px;padding:8px 11px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
  .caso:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .caso.on{background:var(--soft);border-color:var(--p2);border-left-color:var(--p2)}
  .caso .t{font-weight:700;margin-top:2px}
  .domanda{font-weight:600;margin:0 0 8px}
  .passo{min-height:90px}
  .nav{display:flex;gap:8px;align-items:center;margin-top:8px}
  .nav .mini{margin-left:auto}
  .ris{border:1px solid #a7f3d0;background:#ecfdf5;border-radius:10px;padding:10px 14px}
  html:fullscreen body{height:100vh;overflow:auto;padding:16px 28px;font-size:15px}
  html:fullscreen .main{grid-template-columns:minmax(0,1fr) 360px}
</style></head>
<body>
<div class="modi"><a id="m-esplora" class="on">Esplora</a><a id="m-casi">Domande di business</a><button class="fs" id="fs" hidden>⛶ Schermo intero</button></div>

<div id="casi" hidden>
  <div class="casi" id="casi-list"></div>
</div>

<div class="row" id="ctrl">
  <span class="k">Mezzo</span>
  <div class="pills" id="mezzi"></div>
  <label class="ck"><input type="checkbox" id="c-res" checked><i style="background:var(--red)"></i>residui</label>
  <label class="ck"><input type="checkbox" id="c-sq"><i style="background:rgba(185,28,28,.35)"></i>quadrati</label>
  <label class="ck"><input type="checkbox" id="c-mean"><i style="background:var(--oro)"></i>media</label>
  <label class="ck"><input type="checkbox" id="c-ols"><i style="background:var(--p2)"></i>minimi quadrati</label>
</div>

<div class="main">
  <div class="chart" id="chart"><svg id="svg" viewBox="0 0 760 420"></svg><div class="tip" id="tip"></div></div>
  <div class="side" id="side">
    <div id="pan-esplora" class="side">
      <div class="card">
        <div class="k">La tua retta</div>
        <div class="eq" id="eq"></div>
        <div class="mini">Trascina i due cerchi arancioni.</div>
        <div class="row" style="margin:8px 0 0"><button class="btn" id="b-flat">Piatta sulla media</button><button class="btn pri" id="b-best">Mostra la migliore</button></div>
      </div>
      <div class="card" id="card-rss">
        <div class="k">Quanto sbaglia: RSS</div>
        <div class="big" id="rss"></div>
        <div class="bar"><span id="rssbar"></span><em id="rssmin"></em></div>
        <div class="mini" id="rsstxt"></div>
      </div>
      <div class="card soft">
        <div class="k">Quanto spiega: R²</div>
        <div class="big" id="r2"></div>
        <div class="mini" id="r2txt"></div>
      </div>
      <div class="card pred">
        <label class="ck"><input type="checkbox" id="c-pred"><span><b>Prevedi</b> con la retta dei minimi quadrati</span></label>
        <div id="pred-box" hidden>
          <input type="range" id="pred" min="0" max="1" step="0.001" value="0.3">
          <div id="predtxt"></div>
        </div>
      </div>
    </div>
    <div id="pan-casi" hidden>
      <div class="card">
        <div class="domanda" id="c-dom"></div>
        <div class="passo" id="c-txt"></div>
        <div class="nav"><button class="btn" id="c-prev">← Indietro</button><button class="btn pri" id="c-next">Avanti →</button><span class="mini" id="c-n"></span></div>
      </div>
      <div class="ris" id="c-ris" hidden></div>
    </div>
  </div>
</div>

.9,19.6,17.3,7.6,9.7,12.8,25.5,13.4]};

const MEZZI={TV:{lab:'TV',max:300},radio:{lab:'Radio',max:50},newspaper:{lab:'Giornali',max:115}};
const $=id=>document.getElementById(id);
const num=(x,d=0)=>{const s=Math.abs(x).toFixed(d).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return(x<0&&+Math.abs(x).toFixed(d)!==0?'−':'')+s.join(',');};

const ybar=mean(D.sales);
const TSS=D.sales.reduce((s,y)=>s+(y-ybar)**2,0);
function ols(x){const xs=D[x],xb=mean(xs);let sxy=0,sxx=0;for(let i=0;i<N;i++){sxy+=(xs[i]-xb)*(D.sales[i]-ybar);sxx+=(xs[i]-xb)**2;}const b=sxy/sxx;return{a:ybar-b*xb,b};}
function rss(a,b,x){const xs=D[x];let s=0;for(let i=0;i<N;i++)s+=(D.sales[i]-a-b*xs[i])**2;return s;}

const ix=px=>(px-L)/(W-L-R)*xDom(), iy=py=>yDom[0]+(1-(py-T)/(H-T-B))*(yDom[1]-yDom[0]);

function clip(a,b){ // segmento della retta dentro il riquadro

  el('text',{x:(L+W-R)/2,y:H-8,'text-anchor':'middle',class:'axt'},svg).textContent=`Budget ${m.lab} (migliaia di $)`;

    el('text',{x:W-R-4,y:sy(ybar)-6,'text-anchor':'end',class:'tick',fill:'var(--oro)'},g).textContent='media delle vendite';}

    c.addEventListener('pointerenter',e=>tip(e,i));c.addEventListener('pointerleave',()=>$('tip').style.display='none');}
  // retta dei minimi quadrati
  const o=best();
  if(S.ols||S.pred){const p=clip(o.a,o.b);el('line',{x1:sx(p[0][0]),y1:sy(p[0][1]),x2:sx(p[1][0]),y2:sy(p[1][1]),stroke:'var(--p2)','stroke-width':S.ols?3:1.6,opacity:S.ols?1:.5},g);}
  // retta dell'utente con i due cerchi
  const p=clip(S.a,S.b);
  el('line',{x1:sx(p[0][0]),y1:sy(p[0][1]),x2:sx(p[1][0]),y2:sy(p[1][1]),stroke:'var(--oro)','stroke-width':3},g);
  hx().forEach((xv,k)=>{const yv=Math.max(yDom[0],Math.min(yDom[1],S.a+S.b*xv));const h=el('g',{class:'handle'},g);
    el('circle',{cx:sx(xv),cy:sy(yv),r:16,fill:'transparent'},h);el('circle',{class:'v',cx:sx(xv),cy:sy(yv),r:8},h);
    h.addEventListener('pointerdown',e=>startDrag(e,k));});
  // previsione
  if(S.pred){const xv=S.pv*xDom(),yv=o.a+o.b*xv;
    el('line',{x1:sx(xv),x2:sx(xv),y1:H-B,y2:sy(yv),stroke:'var(--p2)','stroke-dasharray':'4 3'},g);
    el('line',{x1:L,x2:sx(xv),y1:sy(yv),y2:sy(yv),stroke:'var(--p2)','stroke-dasharray':'4 3'},g);
    el('circle',{cx:sx(xv),cy:sy(yv),r:6,fill:xv>xm?'var(--red)':'var(--p2)'},g);}
  panel();
}
function tip(e,i){const xs=D[S.x],yh=S.a+S.b*xs[i],r=D.sales[i]-yh,t=$('tip');
  t.innerHTML=`<b>Mercato ${i+1}</b><br><span class="c">${MEZZI[S.x].lab}:</span> ${num(xs[i],1)} mila $<br><span class="c">vendite:</span> ${num(D.sales[i],1)} mila<br><span class="c">la tua retta prevede:</span> ${num(yh,1)}<br><span class="c">residuo:</span> ${r>=0?'+':''}${num(r,1)}`;
  const b=$('chart').getBoundingClientRect();t.style.display='block';t.style.left=Math.min(e.clientX-b.left+12,b.width-190)+'px';t.style.top=(e.clientY-b.top+12)+'px';}

// ── trascinamento dei cerchi ──
let drag=null;
function startDrag(e,k){e.preventDefault();drag=k;stopAnim();svg.setPointerCapture&&svg.setPointerCapture(e.pointerId);}
svg.addEventListener('pointermove',e=>{if(drag===null)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  const yv=Math.max(yDom[0],Math.min(yDom[1],iy(q.y))),[x0,x1]=hx();
  const y0=drag===0?yv:S.a+S.b*x0,y1=drag===1?yv:S.a+S.b*x1;S.b=(y1-y0)/(x1-x0);S.a=y0-S.b*x0;draw();});
const endDrag=()=>{drag=null;};
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);

// ── animazione verso una retta ──
function stopAnim(){if(S.anim){cancelAnimationFrame(S.anim);S.anim=null;}}
function goTo(a,b,ms=700){stopAnim();const a0=S.a,b0=S.b,t0=performance.now();
  const f=t=>{const u=Math.min(1,(t-t0)/ms),e=u<.5?2*u*u:1-(-2*u+2)**2/2;S.a=a0+(a-a0)*e;S.b=b0+(b-b0)*e;draw();if(u<1)S.anim=requestAnimationFrame(f);else S.anim=null;};S.anim=requestAnimationFrame(f);}

// ── pannello ──
function panel(){
  const m=MEZZI[S.x],o=best(),r=rss(S.a,S.b,S.x),rmin=rss(o.a,o.b,S.x),r2=1-r/TSS;
  $('eq').innerHTML=`Vendite = ${num(S.a,2)} ${S.b<0?'−':'+'} ${num(Math.abs(S.b),4)} × ${m.lab}`;
  $('rss').textContent=num(r,0);
  $('rssbar').style.width=Math.min(100,100*r/TSS)+'%';$('rssmin').style.left=(100*rmin/TSS)+'%';
  const vicino=r-rmin<0.005*rmin;
  $('card-rss').className='card'+(vicino?' ok':'');
  $('rsstxt').innerHTML=vicino?`<b>È la retta dei minimi quadrati:</b> nessuna retta sbaglia meno di ${num(rmin,0)}.`
    :`La barra intera è la TSS, ${num(TSS,0)}: l'RSS della retta piatta sulla media. La tacca blu è il minimo possibile, ${num(rmin,0)}.`;
  $('r2').textContent=r2<0?'< 0':num(r2,3);
  $('r2txt').innerHTML=r2<0?'La tua retta sbaglia più della media: peggio che non usare il budget.':`La tua retta spiega il <b>${num(100*r2,0)}%</b> della variabilità delle vendite. Il massimo con ${m.lab} è ${num(100*(1-rmin/TSS),0)}%.`;
  if(S.pred){const xv=S.pv*xDom(),yv=o.a+o.b*xv,xm=xmaxDati();
    $('predtxt').innerHTML=`Budget ${m.lab}: <b>${num(xv*1000/1000,0)} mila $</b><br>Vendite previste: <b>${unita(yv)}</b>`+(xv>xm?`<br><span class="warn">Fuori dai dati: il budget più alto osservato è ${num(xm,1)} mila $. È un'estrapolazione.</span>`:'');}
}

// ── comandi ──
function setX(x){S.x=x;[...$('mezzi').children].forEach(b=>b.classList.toggle('on',b.dataset.x===x));}
Object.keys(MEZZI).forEach(x=>{const b=document.createElement('button');b.textContent=MEZZI[x].lab;b.dataset.x=x;b.onclick=()=>{stopAnim();setX(x);S.a=ybar;S.b=0;draw();};$('mezzi').appendChild(b);});
const cks={res:'c-res',sq:'c-sq',mean:'c-mean',ols:'c-ols'};
for(const k in cks)$(cks[k]).onchange=e=>{S[k]=e.target.checked;draw();};
const syncCk=()=>{for(const k in cks)$(cks[k]).checked=S[k];$('c-pred').checked=S.pred;$('pred-box').hidden=!S.pred;};
$('c-pred').onchange=e=>{S.pred=e.target.checked;$('pred-box').hidden=!S.pred;draw();};
$('pred').oninput=e=>{S.pv=+e.target.value;draw();};
$('b-flat').onclick=()=>goTo(ybar,0);
$('b-best').onclick=()=>{const o=best();goTo(o.a,o.b);};

// ── domande di business ──
const ctx=()=>{const o=best();return{o,r2:1-rss(o.a,o.b,S.x)/TSS,rmin:rss(o.a,o.b,S.x)};};
const R2={};Object.keys(MEZZI).forEach(x=>{const o=ols(x);R2[x]=1-rss(o.a,o.b,x)/TSS;});
const CASI=[
{tag:'Minimi quadrati',t:'Quale retta?',q:'Tra tutte le rette che si possono disegnare su questi 200 mercati, quale scegliamo?',
 passi:[
  {set:{x:'TV',line:'flat',res:true,sq:false,mean:true,ols:false},txt:c=>`Partiamo dalla retta più semplice: piatta, sulla media delle vendite (${num(ybar,1)} mila unità). Ignora del tutto il budget TV. Le linee rosse sono i suoi errori: la loro somma dei quadrati, la TSS, vale <b>${num(TSS,0)}</b>.`},
  {set:{sq:true},txt:c=>`Ogni errore al quadrato è un quadratino: i mercati lontani dalla retta pesano molto di più di quelli vicini. Ora <b>trascina il cerchio arancione di destra verso l'alto</b> e guarda i quadrati e l'RSS a destra.`},
  {set:{line:'ols'},txt:c=>`Questa è la retta che rende minima la somma dei quadrati: la retta dei <b>minimi quadrati</b>. RSS ${num(c.rmin,0)}, contro ${num(TSS,0)} della retta piatta. Prova a spostarla: qualunque movimento fa crescere l'RSS.`,
   ris:c=>`La regressione sceglie la retta che sbaglia meno, misurando l'errore come somma dei quadrati dei residui. Rispetto alla media, l'errore scende da ${num(TSS,0)} a ${num(c.rmin,0)}: la TV spiega il <b>${num(100*c.r2,0)}%</b> della variabilità delle vendite. È l'R².`}]},
{tag:'Leggere la pendenza',t:'Quanto rendono 1.000 $ in TV?',q:'Il direttore marketing vuole sapere se un altro mille dollari di TV si ripaga.',
 passi:[
  {set:{x:'TV',line:'ols',res:false,sq:false,mean:false,ols:true},txt:c=>`La retta dei minimi quadrati: vendite = ${num(c.o.a,2)} + ${num(c.o.b,4)} × TV. La pendenza dice che ogni mille dollari in più di TV si associano a <b>${num(c.o.b*1000,1)} unità</b> vendute in più.`},
  {set:{pred:true,pv:100/405},txt:c=>`Con 100 mila dollari di TV la retta prevede ${unita(c.o.a+c.o.b*100)}; con 200 mila, ${unita(c.o.a+c.o.b*200)}. Usa il cursore <b>Prevedi</b> per provare altri budget.`},
  {set:{pv:400/405},txt:c=>`E con 400 mila dollari? La retta prevede ${unita(c.o.a+c.o.b*400)}, ma nessun mercato ha mai speso più di ${num(xmaxDati(),0)} mila: stiamo <b>estrapolando</b>. Il mercato potrebbe saturarsi molto prima.`,
   ris:c=>`Mille dollari in TV si associano a ${num(c.o.b*1000,1)} unità in più. Se ogni unità lascia un margine superiore a <b>${num(1000/(c.o.b*1000),0)} $</b>, la spesa si ripaga, ma solo dentro i budget osservati e solo se l'associazione è anche causa: forse si spende di più in TV dove il mercato è già più grande.`}]},
{tag:'R² a confronto',t:'Quale mezzo spiega di più?',q:'Se potessimo guardare un solo mezzo per capire le vendite, quale sceglieremmo?',
 passi:[
  {set:{x:'TV',line:'ols',res:true,sq:false,mean:false,ols:true,pred:false},txt:c=>`TV: i punti stanno vicini alla retta. R² = <b>${num(R2.TV,3)}</b>.`},
  {set:{x:'radio',line:'ols'},txt:c=>`Radio: la retta sale ancora, ma i punti sono più sparsi. R² = <b>${num(R2.radio,3)}</b>. Per mille dollari la radio sembra rendere di più (${num(ols('radio').b*1000,0)} unità), ma spiega meno.`},
  {set:{x:'newspaper',line:'ols'},txt:c=>`Giornali: la retta è quasi piatta e i residui enormi. R² = <b>${num(R2.newspaper,3)}</b>.`,
   ris:c=>`La TV da sola spiega il ${num(100*R2.TV,0)}% delle differenze di vendita, la radio il ${num(100*R2.radio,0)}%, i giornali il ${num(100*R2.newspaper,0)}%. Ma tre rette separate non dicono cosa succede quando i mezzi si usano insieme: per quello serve la regressione multipla, nella prossima esplorazione.`}]}
];
let caso=0,passo=0;
function applica(set){const s={...set};if(s.x){setX(s.x);}['res','sq','mean','ols','pred'].forEach(k=>{if(k in s)S[k]=s[k];});if('pv' in s){S.pv=s.pv;$('pred').value=s.pv;}
  syncCk();if(s.line==='flat')goTo(ybar,0);else if(s.line==='ols'){const o=best();goTo(o.a,o.b);}else draw();}
function mostraCaso(){const C=CASI[caso];[...$('casi-list').children].forEach((b,i)=>b.classList.toggle('on',i===caso));
  $('c-dom').textContent=C.q;
  // ricostruisce lo stato applicando i passi fino a quello corrente
  for(let k=0;k<=passo;k++)applica(C.passi[k].set);
  const P=C.passi[passo];$('c-txt').innerHTML=P.txt(ctx());
  $('c-ris').hidden=!P.ris;if(P.ris)$('c-ris').innerHTML='<div class="k">Risposta</div>'+P.ris(ctx());
  $('c-prev').disabled=passo===0;$('c-next').disabled=passo===C.passi.length-1;$('c-n').textContent=`passo ${passo+1} di ${C.passi.length}`;}
CASI.forEach((C,i)=>{const b=document.createElement('button');b.className='caso';b.innerHTML=`<div class="k">${C.tag}</div><div class="t">${C.t}</div>`;b.onclick=()=>{caso=i;passo=0;mostraCaso();};$('casi-list').appendChild(b);});
$('c-prev').onclick=()=>{if(passo>0){passo--;mostraCaso();}};
$('c-next').onclick=()=>{if(passo<CASI[caso].passi.length-1){passo++;mostraCaso();}};

function setMode(m){const c=m==='casi';$('m-esplora').classList.toggle('on',!c);$('m-casi').classList.toggle('on',c);$('casi').hidden=!c;$('pan-esplora').hidden=c;$('pan-casi').hidden=!c;
  if(c){caso=0;passo=0;mostraCaso();}}
$('m-esplora').onclick=()=>setMode('esplora');$('m-casi').onclick=()=>setMode('casi');
document.addEventListener('keydown',e=>{if($('pan-casi').hidden)return;if(e.key==='ArrowRight')$('c-next').click();if(e.key==='ArrowLeft')$('c-prev').click();});

// ── schermo intero ──
{const fs=$('fs'),de=document.documentElement,on=()=>document.fullscreenElement||document.webkitFullscreenElement;
 if(de.requestFullscreen||de.webkitRequestFullscreen){fs.hidden=false;
  fs.onclick=()=>{if(on())return (document.exitFullscreen||document.webkitExitFullscreen).call(document);const r=(de.requestFullscreen||de.webkitRequestFullscreen).call(de);if(r&&r.catch)r.catch(()=>{if(window.parent!==window)window.open(location.href,'_blank');});};
  const lab=()=>fs.textContent=on()?'✕ Esci dallo schermo intero':'⛶ Schermo intero';document.addEventListener('fullscreenchange',lab);document.addEventListener('webkitfullscreenchange',lab);}}

setX('TV');S.a=ybar;S.b=0;syncCk();draw();
if(location.hash==='#casi')setMode('casi');
if(window.parent!==window&&window.ResizeObserver)new ResizeObserver(()=>parent.postMessage({esplorazione:document.body.scrollHeight},'*')).observe(document.body);
</script>
</body></html>

const LIN=(()=>{let mx=0,my=0;for(let i=0;i<N;i++){mx+=D.b[i];my+=D.y[i];}mx/=N;my/=N;let sxy=0,sxx=0;for(let i=0;i<N;i++){sxy+=(D.b[i]-mx)*(D.y[i]-my);sxx+=(D.b[i]-mx)**2;}const b=sxy/sxx;return{a:my-b*mx,b,rate:my};})();
function ll(a,b){let s=0;for(let i=0;i<N;i++){const z=a+b*D.b[i];s+=D.y[i]?-Math.log1p(Math.exp(-z)):-Math.log1p(Math.exp(z));}return s;}
const LLMAX=ll(FIT.a,FIT.b), A0=logit(LIN.rate), LL0=ll(A0,0), LLLOW=LL0-0.6*(LLMAX-LL0);
// punti da disegnare: tutti i default e 1.000 clienti a caso tra gli altri (seme fisso)
const PTS=(()=>{let s=7;const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const no=[],si=[];for(let i=0;i<N;i++)(D.y[i]?si:no).push(i);
  for(let i=no.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[no[i],no[j]]=[no[j],no[i]];}
  return si.concat(no.slice(0,1000)).map(i=>({x:D.b[i],y:D.y[i],j:(r()-0.5)*0.07}));})();
// quota di default per fasce di 100 $
const BINS=(()=>{const c={},d={};for(let i=0;i<N;i++){const k=Math.floor(D.b[i]/100);c[k]=(c[k]||0)+1;d[k]=(d[k]||0)+D.y[i];}
  return Object.keys(c).filter(k=>c[k]>=20).map(k=>({x:+k*100+50,p:d[k]/c[k],n:c[k]}));})();

const S={mode:'curva',a:A0,b:0,anim:null,marks:[],pv:1500};
const svg=$('svg');let drag=null;
function draw(){
  svg.innerHTML='';
  const g=el('g',{},svg);
  // fasce fuori da [0,1]
  el('rect',{x:ML,y:sy(YMAX),width:W-ML-MR,height:sy(1)-sy(YMAX),fill:'#fef2f2'},g);
  el('rect',{x:ML,y:sy(0),width:W-ML-MR,height:sy(YMIN)-sy(0),fill:'#fef2f2'},g);
  for(const v of [0,0.25,0.5,0.75,1]){el('line',{x1:ML,x2:W-MR,y1:sy(v),y2:sy(v),stroke:v===0||v===1?'#cbd5e1':'#eef2f7'},g);txt(ML-8,sy(v)+4,pct(v,0),'tick',g,'end');}
  for(let x=0;x<=2500;x+=500){el('line',{x1:sx(x),x2:sx(x),y1:sy(YMIN),y2:sy(YMIN)+5,stroke:'#94a3b8'},g);txt(sx(x),sy(YMIN)+18,num(x)+' $','tick',g);}
  txt((ML+W-MR)/2,H-4,'Saldo della carta','axt',g);
  const yl=txt(14,(MT+H-MB)/2,'Probabilità di default','axt',g);yl.setAttribute('transform',`rotate(-90 14 ${(MT+H-MB)/2})`);
  // punti
  for(const p of PTS)el('circle',{cx:sx(p.x),cy:sy(p.y+p.j),r:2.2,fill:p.y?'#b91c1c':'#64748b','fill-opacity':p.y?0.55:0.25},g);
  // quote per fascia
  for(const q of BINS)el('rect',{x:sx(q.x)-4,y:sy(q.p)-4,width:8,height:8,fill:'#d4930d',stroke:'#fff','stroke-width':1},g);
  // modello
  if(S.mode==='retta'){
    el('line',{x1:sx(0),y1:sy(LIN.a),x2:sx(XMAX),y2:sy(LIN.a+LIN.b*XMAX),stroke:'#2563eb','stroke-width':3},g);
    const x0=-LIN.a/LIN.b;if(x0>0)el('line',{x1:sx(0),y1:sy(LIN.a),x2:sx(x0),y2:sy(0),stroke:'#b91c1c','stroke-width':4,'stroke-linecap':'round'},g);
  }else{
    let d='';for(let x=0;x<=XMAX;x+=10)d+=(x?'L':'M')+sx(x).toFixed(1)+','+sy(sig(S.a+S.b*x)).toFixed(1);
    el('path',{d,fill:'none',stroke:'#113159','stroke-width':3},g);
    for(const [k,x] of [[1,X1],[2,X2]]){const h=el('g',{class:'handle'},g);el('circle',{cx:sx(x),cy:sy(sig(S.a+S.b*x)),r:14,fill:'transparent'},h);el('circle',{class:'v',cx:sx(x),cy:sy(sig(S.a+S.b*x)),r:7},h);
      h.addEventListener('pointerdown',e=>{e.preventDefault();drag=k;stop();svg.setPointerCapture&&svg.setPointerCapture(e.pointerId);});}
  }
  for(const m of S.marks){const p=S.mode==='retta'?LIN.a+LIN.b*m:sig(S.a+S.b*m);
    el('line',{x1:sx(m),x2:sx(m),y1:sy(YMIN),y2:sy(p),stroke:'#7c3aed','stroke-dasharray':'4 3'},g);
    el('circle',{cx:sx(m),cy:sy(p),r:5,fill:'#7c3aed'},g);
    const t=txt(sx(m)+8,sy(p)-8,num(m)+' $ → '+pct(p,1),'axt',g,'start');t.setAttribute('fill','#7c3aed');}
  panel();
}
function pt(e){const r=svg.getScreenCTM().inverse(),q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(r);}
svg.addEventListener('pointermove',e=>{if(!drag)return;const y=Math.min(0.995,Math.max(0.005,iy(pt(e).y)));
  let l1=S.a+S.b*X1,l2=S.a+S.b*X2;if(drag===1)l1=logit(y);else l2=logit(y);S.b=(l2-l1)/(X2-X1);S.a=l1-S.b*X1;draw();});
svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
function stop(){if(S.anim){cancelAnimationFrame(S.anim);S.anim=null;}}
function goTo(a,b,ms=700){stop();const a0=S.a,b0=S.b,t0=performance.now();const f=t=>{const u=Math.min(1,(t-t0)/ms),k=u<.5?2*u*u:1-(-2*u+2)**2/2;S.a=a0+(a-a0)*k;S.b=b0+(b-b0)*k;draw();if(u<1)S.anim=requestAnimationFrame(f);else S.anim=null;};S.anim=requestAnimationFrame(f);}
function panel(){
  const c=S.mode==='curva';$('card-ll').hidden=!c;$('b-row').hidden=!c;
  [...$('modi-m').children].forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  if(c){$('eq').innerHTML=`p = 1 / (1 + e<sup>−(${num(S.a,2)} + ${num(S.b,4)} × saldo)</sup>)`;
    $('eqtxt').textContent='Trascina i due cerchi arancioni: cambiano intercetta e pendenza della curva.';
    const l=ll(S.a,S.b);$('ll').textContent=num(l,1);
    $('llbar').style.width=Math.max(0,Math.min(100,100*(l-LLLOW)/(LLMAX-LLLOW)))+'%';$('llmax').style.left='calc(100% - 2px)';
    $('lltxt').innerHTML=Math.abs(l-LLMAX)<0.5?'<b>È la curva di massima verosimiglianza.</b>':`La migliore arriva a ${num(LLMAX,1)}. Più è alta, più la curva rende probabili i default e i non default che abbiamo osservato.`;}
  else{$('eq').innerHTML=`p = ${num(LIN.a,3)} + ${num(LIN.b,6)} × saldo`;
    $('eqtxt').innerHTML=`Con saldo 0 $ la retta prevede <span class="warn">${pct(LIN.a,1)}</span>: una probabilità negativa. Sotto ${num(-LIN.a/LIN.b,0)} $ è sempre sotto zero (tratto rosso).`;}
  const p=c?sig(S.a+S.b*S.pv):LIN.a+LIN.b*S.pv;
  $('predtxt').innerHTML=`Saldo <b>${num(S.pv)} $</b>: probabilità prevista <b class="${p<0||p>1?'warn':''}">${pct(p,1)}</b>`;
}
$('modi-m').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;draw();});
$('b-flat').onclick=()=>goTo(A0,0);
$('b-best').onclick=()=>goTo(FIT.a,FIT.b);
$('pred').oninput=e=>{S.pv=+e.target.value;draw();};

ctx=()=>({});
applica=s=>{if(s.mode)S.mode=s.mode;if('marks' in s)S.marks=s.marks;if(s.fit==='flat')goTo(A0,0);else if(s.fit==='best')goTo(FIT.a,FIT.b);else if(s.fit==='poco')goTo(-6,0.0018);else draw();};
const P1=sig(FIT.a+FIT.b*1000),P2=sig(FIT.a+FIT.b*2000);
CASI=[
{tag:'Retta o curva',t:'Perché non una retta?',q:'La banca vuole la probabilità che un cliente vada in default. Possiamo usare la regressione lineare che conosciamo?',
 passi:[
  {set:{mode:'retta',marks:[],fit:'flat'},txt:c=>`Ogni punto è un cliente: in alto chi è andato in default (333 su 10.000), in basso chi ha pagato. I quadratini gialli sono la <b>quota di default</b> per fasce di 100 $ di saldo. La retta blu è la regressione lineare di default (0/1) sul saldo.`},
  {set:{marks:[0,500]},txt:c=>`Con saldi bassi la retta scende sotto lo zero: a 0 $ prevede ${pct(LIN.a,1)}, a 500 $ ${pct(LIN.a+LIN.b*500,1)}. <b>Una probabilità negativa non ha senso.</b> E con saldi alti la retta resta molto sotto le quote osservate.`},
  {set:{mode:'curva',marks:[],fit:'best'},txt:c=>`La curva logistica resta sempre tra 0 e 1: piatta dove il rischio è quasi nullo, ripida tra 1.500 e 2.000 $, e segue i quadratini gialli.`,
   ris:c=>`Quando la risposta è sì o no, vogliamo una <b>probabilità</b>, che deve stare tra 0 e 1. La retta non lo garantisce; la curva a S della regressione logistica sì.`}]},
{tag:'Massima verosimiglianza',t:'Come si sceglie la curva?',q:'Per la retta minimizzavamo la somma dei quadrati dei residui. E per la curva?',
 passi:[
  {set:{mode:'curva',marks:[],fit:'flat'},txt:c=>`Partiamo da una curva piatta: ogni cliente ha la stessa probabilità di default, ${pct(LIN.rate,1)}, qualunque sia il saldo. La barra a destra misura la <b>verosimiglianza</b>: quanto la curva rende probabili i dati osservati.`},
  {set:{fit:'poco'},txt:c=>`Una curva che sale piano va già meglio: dà più rischio a chi ha saldi alti. Ora <b>trascina i cerchi arancioni</b> e prova a far salire la barra.`},
  {set:{fit:'best'},txt:c=>`Questa è la curva di <b>massima verosimiglianza</b>: β₀ = ${num(FIT.a,4)}, β₁ = ${num(FIT.b,4)}, gli stessi numeri della tabella nelle slide.`,
   ris:c=>`La logistica sceglie la curva che rende <b>più probabili</b> i default e i non default che abbiamo davvero osservato: alta probabilità a chi è andato in default, bassa a chi ha pagato. È il criterio della massima verosimiglianza; Python lo fa con <code>smf.logit</code>.`}]},
{tag:'Prevedere',t:'Quanto rischia un cliente?',q:'Due clienti: uno con 1.000 $ di saldo, l\'altro con 2.000 $. Che probabilità di default diamo a ciascuno?',
 passi:[
  {set:{mode:'curva',fit:'best',marks:[1000]},txt:c=>`Con 1.000 $ di saldo la curva è ancora piatta: probabilità <b>${pct(P1,1)}</b>, circa un default ogni ${num(1/P1)} clienti.`},
  {set:{marks:[1000,2000]},txt:c=>`Con 2.000 $ siamo nella parte ripida: <b>${pct(P2,1)}</b>. Il saldo è raddoppiato, la probabilità è quasi cento volte più alta.`},
  {set:{marks:[1000,1500,2000]},txt:c=>`Il saldo pesa in modo diverso a seconda di dove si parte: è il motivo per cui non leggiamo il coefficiente come «punti di probabilità» ma come cambiamento nelle <b>odds</b>. Lo vediamo nella prossima esplorazione.`,
   ris:c=>`${pct(P1,1)} a 1.000 $, ${pct(P2,1)} a 2.000 $: sono i due conti delle slide. La curva trasforma il saldo in una probabilità che la banca può confrontare con quanto le costa un default.`}]}
];
draw();initCasi();

</script>
</body></html>
